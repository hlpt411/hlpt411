name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"     # tu dong chay moi ngay luc 00:00 UTC (7h sang VN)
  workflow_dispatch:        # cho phep bam nut chay tay
  push:
    branches: [main]        # chay them khi co push len main

permissions:
  contents: write           # BAT BUOC: neu thieu, action khong duoc quyen ghi file

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Tao ran
        uses: Platane/snk@v3
        with:
          github_user_name: hlpt411
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#A29BFE&color_dots=#16162a,#3b2f6b,#5b46c9,#6C5CE7,#A29BFE
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#A29BFE&color_dots=#16162a,#3b2f6b,#5b46c9,#6C5CE7,#A29BFE
            dist/github-snake.gif?color_snake=#A29BFE&color_dots=#16162a,#3b2f6b,#5b46c9,#6C5CE7,#A29BFE

      - name: Day vao nhanh output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
